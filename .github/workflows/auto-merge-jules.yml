name: Auto Review and Merge Jules PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Trigger for PRs from Jules or containing agent tags
    if: >
      contains(github.event.pull_request.user.login, 'jules') ||
      contains(github.event.pull_request.title, 'Sentinel') ||
      contains(github.event.pull_request.title, 'Bolt') ||
      contains(github.event.pull_request.title, 'Palette')

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npx vitest run

      - name: Approve and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "Aprovado automaticamente após aprovação nos testes unitários."
          gh pr merge ${{ github.event.pull_request.number }} --merge --admin
