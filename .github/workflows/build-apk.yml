name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Install dependencies
        run: npm install

      - name: Build web assets and sync Capacitor
        run: npm run cap:sync

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK outputs
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/MathUtils.apk
          echo "APK ready at release/MathUtils.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathUtils-Android-APK
          path: release/MathUtils.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          echo "Uploading MathUtils.apk to release $RELEASE_TAG..."
          gh release delete-asset "$RELEASE_TAG" "MathUtils.apk" -y 2>/dev/null || true
          gh release upload "$RELEASE_TAG" release/MathUtils.apk --clobber || true
